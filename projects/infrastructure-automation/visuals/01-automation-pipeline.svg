<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900"><style>text{font-family:Arial}.title{font-size:34px;font-weight:700;fill:white}.sub{font-size:17px;fill:#dbe7f5}.h{font-size:20px;font-weight:700;fill:#153b68}.t{font-size:17px;font-weight:700;fill:#1d2a38}.s{font-size:14px;fill:#44566b}</style><rect width="1400" height="900" fill="#f4f7fb"/><rect width="1400" height="112" fill="#0b1f3a"/><text x="55" y="54" class="title">06 • INFRASTRUCTURE AUTOMATION PIPELINE</text><text x="55" y="84" class="sub">Terraform + Ansible for consistent, secure and auditable infrastructure operations</text><g stroke="#b8c8d8" stroke-width="2"><rect x="55" y="165" width="230" height="110" rx="14" fill="#f4f0ff"/><rect x="330" y="165" width="230" height="110" rx="14" fill="#f4f0ff"/><rect x="605" y="165" width="230" height="110" rx="14" fill="#eef9f2"/><rect x="880" y="165" width="230" height="110" rx="14" fill="#edf5ff"/><rect x="1155" y="165" width="190" height="110" rx="14" fill="#edf5ff"/></g><text x="170" y="205" text-anchor="middle" class="t">Git Repository</text><text x="170" y="235" text-anchor="middle" class="s">Code • playbooks • TF</text><text x="445" y="205" text-anchor="middle" class="t">Terraform</text><text x="445" y="235" text-anchor="middle" class="s">Provision / lifecycle</text><text x="720" y="205" text-anchor="middle" class="t">Ansible</text><text x="720" y="235" text-anchor="middle" class="s">Configure / harden</text><text x="995" y="205" text-anchor="middle" class="t">Validation</text><text x="995" y="235" text-anchor="middle" class="s">Tests / idempotency</text><text x="1250" y="205" text-anchor="middle" class="t">Monitoring</text><text x="1250" y="235" text-anchor="middle" class="s">Prometheus / Grafana</text><g stroke="#42617f" stroke-width="3"><path d="M285 220h40"/><path d="M560 220h40"/><path d="M835 220h40"/><path d="M1110 220h40"/></g><rect x="60" y="360" width="390" height="230" rx="14" fill="#eef9f2" stroke="#94c7a4" stroke-width="2"/><text x="80" y="400" class="h">SECURITY BASELINE</text><text x="100" y="440" class="s">✓ SELinux</text><text x="100" y="470" class="s">✓ firewalld</text><text x="100" y="500" class="s">✓ SSH hardening</text><text x="100" y="530" class="s">✓ auditd / AIDE</text><text x="100" y="560" class="s">✓ least privilege</text><rect x="505" y="360" width="390" height="230" rx="14" fill="#f4f0ff" stroke="#b7a4df" stroke-width="2"/><text x="525" y="400" class="h">SAFE CHANGE MODEL</text><text x="545" y="440" class="s">1. Plan / syntax check</text><text x="545" y="470" class="s">2. Dry run / --check --diff</text><text x="545" y="500" class="s">3. Small scope</text><text x="545" y="530" class="s">4. Post-checks</text><text x="545" y="560" class="s">5. Rollback awareness</text><rect x="950" y="360" width="390" height="230" rx="14" fill="#edf5ff" stroke="#9db9d7" stroke-width="2"/><text x="970" y="400" class="h">ENGINEERING PRINCIPLES</text><text x="990" y="440" class="s">✓ Idempotent</text><text x="990" y="470" class="s">✓ Version-controlled</text><text x="990" y="500" class="s">✓ Reusable roles / modules</text><text x="990" y="530" class="s">✓ Secrets outside source control</text><text x="990" y="560" class="s">✓ Audit-friendly</text><rect x="60" y="650" width="1280" height="145" rx="14" fill="#eef9f2" stroke="#94c7a4" stroke-width="2"/><text x="700" y="695" text-anchor="middle" class="h">CLIENT VALUE</text><text x="700" y="735" text-anchor="middle" class="s">Reduced configuration drift • repeatable deployments • consistent security baseline • smaller blast radius</text><text x="700" y="765" text-anchor="middle" class="s">Useful for server fleets, VM provisioning, patch automation and infrastructure-as-code initiatives</text><text x="55" y="865" class="s">Portfolio evidence • Public lab/reference design • No confidential production data</text></svg>