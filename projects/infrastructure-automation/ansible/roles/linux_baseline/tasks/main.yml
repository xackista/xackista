---
- name: Install baseline packages
  ansible.builtin.package:
    name:
      - chrony
      - firewalld
      - audit
      - aide
    state: present

- name: Enable baseline services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - chronyd
    - firewalld
    - auditd

- name: Enforce SELinux
  ansible.posix.selinux:
    policy: targeted
    state: enforcing

- name: Disable direct root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart sshd

- name: Enable password authentication policy placeholder
  ansible.builtin.debug:
    msg: 'Apply site-specific SSH/password policy through variables; do not hard-code secrets.'
