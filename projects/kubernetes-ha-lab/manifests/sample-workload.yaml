apiVersion: v1
kind: Namespace
metadata:
  name: portfolio-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: portfolio-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: portfolio-demo
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
