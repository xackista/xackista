<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#20223b"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".3"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fdcff"/></marker><style>.T{font:700 38px Arial;fill:#fff}.S{font:400 17px Arial;fill:#a9bdd2}.H{font:700 18px Arial;fill:#7fdcff}.B{font:700 20px Arial;fill:#fff}.M{font:400 14px Arial;fill:#b9cbdd}.P{fill:#12263b;stroke:#365570;stroke-width:2}.C{fill:#143b58;stroke:#59bce9;stroke-width:2}.G{fill:#103c37;stroke:#37c9a4;stroke-width:2}.V{fill:#2d2142;stroke:#ad8cff;stroke-width:2}.R{fill:#3d2029;stroke:#ff718d;stroke-width:2}.L{stroke:#7fdcff;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="60" y="62" class="T">OBSERVABILITY • DETECT → CORRELATE → RESPOND</text><text x="60" y="94" class="S">Metrics, dashboards and actionable alerts tied to operational troubleshooting</text><g filter="url(#s)"><rect x="55" y="145" width="1490" height="315" rx="26" class="P"/></g><text x="85" y="185" class="H">TELEMETRY PIPELINE</text><g><rect x="85" y="220" width="300" height="170" rx="20" class="C"/><text x="235" y="258" text-anchor="middle" class="B">DATA SOURCES</text><text x="110" y="292" class="M">Linux exporters • Kubernetes</text><text x="110" y="322" class="M">applications • network devices</text><text x="110" y="352" class="M">databases • logs</text><rect x="470" y="235" width="280" height="140" rx="20" class="G"/><text x="610" y="275" text-anchor="middle" class="B">PROMETHEUS</text><text x="610" y="308" text-anchor="middle" class="M">scrape • store • query</text><text x="610" y="338" text-anchor="middle" class="M">time-series evidence</text><rect x="835" y="220" width="280" height="170" rx="20" class="V"/><text x="975" y="258" text-anchor="middle" class="B">GRAFANA</text><text x="975" y="292" text-anchor="middle" class="M">dashboards • trends</text><text x="975" y="322" text-anchor="middle" class="M">capacity • correlation</text><rect x="1200" y="220" width="305" height="170" rx="20" class="R"/><text x="1352" y="258" text-anchor="middle" class="B">ALERTMANAGER</text><text x="1352" y="292" text-anchor="middle" class="M">group • route • notify</text><text x="1352" y="322" text-anchor="middle" class="M">email • webhook • Slack</text><path d="M385 305H465M750 305H830M1115 305H1195" class="L"/></g><g><rect x="55" y="505" width="470" height="235" rx="24" class="P"/><text x="85" y="545" class="H">SIGNALS THAT MATTER</text><text x="90" y="585" class="M">CPU • memory • load • I/O</text><text x="90" y="620" class="M">filesystem • latency • availability</text><text x="90" y="655" class="M">error rate • saturation • capacity</text><rect x="565" y="505" width="470" height="235" rx="24" class="P"/><text x="595" y="545" class="H">OPERATIONAL LOOP</text><text x="600" y="585" class="M">01 detect anomaly</text><text x="600" y="620" class="M">02 correlate metrics + logs</text><text x="600" y="655" class="M">03 isolate service / layer</text><text x="600" y="690" class="M">04 remediate → validate</text><rect x="1075" y="505" width="470" height="235" rx="24" class="P"/><text x="1105" y="545" class="H">CLIENT OUTCOME</text><text x="1110" y="585" class="M">Earlier detection</text><text x="1110" y="620" class="M">Actionable alerting</text><text x="1110" y="655" class="M">Trend visibility + capacity planning</text><text x="1110" y="690" class="M">Faster root-cause isolation</text></g><rect x="55" y="785" width="1490" height="115" rx="24" class="G"/><text x="800" y="830" text-anchor="middle" class="B">OBSERVABILITY IS EVIDENCE</text><text x="800" y="865" text-anchor="middle" class="M">The monitoring stack feeds the same incident workflow: signal → context → decision → remediation → validation.</text><text x="60" y="965" class="S">PUBLIC PORTFOLIO EVIDENCE • LAB/REFERENCE DESIGN • NO CONFIDENTIAL PRODUCTION DATA</text></svg>