<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900"><style>text{font-family:Arial}.title{font-size:34px;font-weight:700;fill:white}.sub{font-size:17px;fill:#dbe7f5}.h{font-size:20px;font-weight:700;fill:#153b68}.t{font-size:17px;font-weight:700;fill:#1d2a38}.s{font-size:14px;fill:#44566b}</style><rect width="1400" height="900" fill="#f4f7fb"/><rect width="1400" height="112" fill="#0b1f3a"/><text x="55" y="54" class="title">08 • MONITORING &amp; OBSERVABILITY</text><text x="55" y="84" class="sub">Metrics, alerting, dashboards and log context for faster detection and recovery</text><rect x="55" y="165" width="300" height="330" rx="14" fill="#edf5ff" stroke="#9db9d7" stroke-width="2"/><text x="75" y="205" class="h">DATA SOURCES</text><text x="95" y="245" class="s">✓ Linux node exporters</text><text x="95" y="275" class="s">✓ Kubernetes metrics</text><text x="95" y="305" class="s">✓ Applications / exporters</text><text x="95" y="335" class="s">✓ Network devices</text><text x="95" y="365" class="s">✓ Databases</text><text x="95" y="395" class="s">✓ Logs</text><rect x="470" y="190" width="260" height="95" rx="14" fill="#eef9f2" stroke="#94c7a4" stroke-width="2"/><text x="600" y="230" text-anchor="middle" class="t">Prometheus</text><text x="600" y="258" text-anchor="middle" class="s">Time-series metrics</text><rect x="850" y="165" width="260" height="95" rx="14" fill="#f4f0ff" stroke="#b7a4df" stroke-width="2"/><text x="980" y="205" text-anchor="middle" class="t">Grafana</text><text x="980" y="233" text-anchor="middle" class="s">Dashboards / trends</text><rect x="850" y="330" width="260" height="95" rx="14" fill="#fff1f1" stroke="#e4a0a0" stroke-width="2"/><text x="980" y="370" text-anchor="middle" class="t">Alertmanager</text><text x="980" y="398" text-anchor="middle" class="s">Routing / grouping</text><rect x="1170" y="250" width="175" height="95" rx="14" fill="#edf5ff" stroke="#9db9d7" stroke-width="2"/><text x="1257" y="290" text-anchor="middle" class="t">Notifications</text><text x="1257" y="318" text-anchor="middle" class="s">Email • Slack • Webhook</text><g stroke="#42617f" stroke-width="3"><path d="M355 300h105"/><path d="M730 235h110"/><path d="M730 260l110 110"/><path d="M1110 378h55"/></g><rect x="470" y="500" width="640" height="150" rx="14" fill="#eef9f2" stroke="#94c7a4" stroke-width="2"/><text x="790" y="540" text-anchor="middle" class="h">OPERATIONAL LOOP</text><text x="790" y="580" text-anchor="middle" class="s">Detect anomaly → correlate metrics/logs → identify service → remediate → validate → document</text><rect x="55" y="690" width="600" height="115" rx="14" fill="#edf5ff" stroke="#9db9d7" stroke-width="2"/><text x="75" y="730" class="h">KEY SIGNALS</text><text x="95" y="765" class="s">CPU • memory • load • filesystem • I/O • latency • availability • error rate</text><rect x="700" y="690" width="645" height="115" rx="14" fill="#eef9f2" stroke="#94c7a4" stroke-width="2"/><text x="720" y="730" class="h">CLIENT OUTCOME</text><text x="740" y="765" class="s">Earlier detection • actionable alerts • trend visibility • capacity planning • faster recovery</text><text x="55" y="865" class="s">Portfolio evidence • Public lab/reference design • No confidential production data</text></svg>