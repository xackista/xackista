<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900"><style>text{font-family:Arial}.title{font-size:34px;font-weight:700;fill:white}.sub{font-size:17px;fill:#dbe7f5}.h{font-size:20px;font-weight:700;fill:#153b68}.t{font-size:17px;font-weight:700;fill:#1d2a38}.s{font-size:14px;fill:#44566b}</style><rect width="1400" height="900" fill="#f4f7fb"/><rect width="1400" height="112" fill="#0b1f3a"/><text x="55" y="54" class="title">07 • CEPH STORAGE + KUBERNETES CSI</text><text x="55" y="84" class="sub">Persistent storage flow from application pod to Ceph-backed volume</text><g stroke="#b8c8d8" stroke-width="2"><rect x="55" y="170" width="220" height="100" rx="14" fill="#edf5ff"/><rect x="340" y="170" width="220" height="100" rx="14" fill="#edf5ff"/><rect x="625" y="170" width="240" height="100" rx="14" fill="#f4f0ff"/><rect x="930" y="170" width="220" height="100" rx="14" fill="#eef9f2"/><rect x="1215" y="170" width="130" height="100" rx="14" fill="#eef9f2"/></g><text x="165" y="210" text-anchor="middle" class="t">Kubernetes Pod</text><text x="165" y="240" text-anchor="middle" class="s">Application • /data</text><text x="450" y="210" text-anchor="middle" class="t">PVC</text><text x="450" y="240" text-anchor="middle" class="s">PersistentVolumeClaim</text><text x="745" y="210" text-anchor="middle" class="t">CSI Driver</text><text x="745" y="240" text-anchor="middle" class="s">ceph-csi / RBD</text><text x="1040" y="210" text-anchor="middle" class="t">Ceph Pool</text><text x="1040" y="240" text-anchor="middle" class="s">RBD block volume</text><text x="1280" y="210" text-anchor="middle" class="t">OSDs</text><text x="1280" y="240" text-anchor="middle" class="s">data</text><g stroke="#42617f" stroke-width="3"><path d="M275 220h60"/><path d="M560 220h60"/><path d="M865 220h60"/><path d="M1150 220h60"/></g><rect x="55" y="350" width="390" height="230" rx="14" fill="#edf5ff" stroke="#9db9d7" stroke-width="2"/><text x="75" y="390" class="h">CEPH CONTROL PLANE</text><text