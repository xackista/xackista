<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07121d"/><stop offset="1" stop-color="#17352f"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".3"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#70e1c2"/></marker><style>.T{font:700 38px Arial;fill:#fff}.S{font:400 17px Arial;fill:#aac3c4}.H{font:700 18px Arial;fill:#70e1c2}.B{font:700 20px Arial;fill:#fff}.M{font:400 14px Arial;fill:#bad0d0}.P{fill:#122a2d;stroke:#3c6263;stroke-width:2}.G{fill:#103e38;stroke:#39c9a5;stroke-width:2}.C{fill:#14364b;stroke:#59bce9;stroke-width:2}.V{fill:#2b2140;stroke:#ae8cff;stroke-width:2}.R{fill:#3c2029;stroke:#ff718d;stroke-width:2}.L{stroke:#70e1c2;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="60" y="62" class="T">CEPH • KUBERNETES CSI STORAGE</text><text x="60" y="94" class="S">Tracing persistent application data from PVC intent to Ceph-backed block storage</text><g filter="url(#s)"><rect x="55" y="145" width="1490" height="280" rx="26" class="P"/></g><text x="85" y="185" class="H">APPLICATION → STORAGE DATA PATH</text><g><rect x="85" y="220" width="235" height="135" rx="18" class="C"/><text x="202" y="260" text-anchor="middle" class="B">POD</text><text x="202" y="290" text-anchor="middle" class="M">application /data</text><text x="202" y="316" text-anchor="middle" class="M">mount request</text><rect x="365" y="220" width="235" height="135" rx="18" class="V"/><text x="482" y="260" text-anchor="middle" class="B">PVC</text><text x="482" y="290" text-anchor="middle" class="M">storage intent</text><text x="482" y="316" text-anchor="middle" class="M">access + capacity</text><rect x="645" y="220" width="260" height="135" rx="18" class="C"/><text x="775" y="260" text-anchor="middle" class="B">CEPH-CSI</text><text x="775" y="290" text-anchor="middle" class="M">provision • attach • mount</text><text x="775" y="316" text-anchor="middle" class="M">CephX authentication</text><rect x="950" y="220" width="235" height="135" rx="18" class="G"/><text x="1067" y="260" text-anchor="middle" class="B">RBD IMAGE</text><text x="1067" y="290" text-anchor="middle" class="M">Ceph pool</text><text x="1067" y="316" text-anchor="middle" class="M">persistent block volume</text><rect x="1230" y="220" width="275" height="135" rx="18" class="G"/><text x="1367" y="260" text-anchor="middle" class="B">OSD CLUSTER</text><text x="1367" y="290" text-anchor="middle" class="M">replication • recovery</text><text x="1367" y="316" text-anchor="middle" class="M">capacity • latency</text><path d="M320 287H360M600 287H640M905 287H945M1185 287H1225" class="L"/></g><g><rect x="55" y="465" width="470" height="250" rx="24" class="P"/><text x="85" y="505" class="H">CEPH CONTROL PLANE</text><text x="90" y="545" class="M">MON quorum • manager</text><text x="90" y="580" class="M">pool / image metadata</text><text x="90" y="615" class="M">CephX authentication</text><text x="90" y="650" class="M">health / recovery state</text><rect x="565" y="465" width="470" height="250" rx="24" class="P"/><text x="595" y="505" class="H">CSI OPERATIONS</text><text x="600" y="545" class="M">Dynamic provisioning</text><text x="600" y="580" class="M">Attach / mount</text><text x="600" y="615" class="M">Expand / reclaim</text><text x="600" y="650" class="M">Permission + connectivity checks</text><rect x="1075" y="465" width="470" height="250" rx="24" class="P"/><text x="1105" y="505" class="H">FAILURE ISOLATION</text><text x="1110" y="545" class="M">PVC Pending → events → CSI logs</text><text x="1110" y="580" class="M">→ Ceph auth → pool/image</text><text x="1110" y="615" class="M">→ OSD health → mount validation</text><text x="1110" y="650" class="M">Evidence before remediation</text></g><rect x="55" y="755" width="1490" height="145" rx="24" class="G"/><text x="800" y="800" text-anchor="middle" class="B">CLIENT OUTCOME</text><text x="800" y="835" text-anchor="middle" class="M">Kubernetes-native persistent storage with scalable capacity, redundancy and evidence-driven troubleshooting.</text><text x="800" y="865" text-anchor="middle" class="M">Ceph health • CSI logs • Kubernetes events • RBD state form one diagnostic chain.</text><text x="60" y="965" class="S">PUBLIC PORTFOLIO EVIDENCE • LAB/REFERENCE DESIGN • NO CONFIDENTIAL PRODUCTION DATA</text></svg>