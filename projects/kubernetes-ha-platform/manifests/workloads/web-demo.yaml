apiVersion: v1
kind: Namespace
metadata:
  name: portfolio-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-demo
  namespace: portfolio-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-demo
  template:
    metadata:
      labels:
        app: web-demo
    spec:
      containers:
        - name: web
          image: nginx:stable
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: web-demo
  namespace: portfolio-demo
spec:
  selector:
    app: web-demo
  ports:
    - port: 80
      targetPort: 80
