<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102b49"/></linearGradient><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#132b45"/><stop offset="1" stop-color="#0d1e32"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#69d2ff"/></marker><style>.T{font:700 38px Arial;fill:#fff}.S{font:400 17px Arial;fill:#9fb8d0}.H{font:700 18px Arial;fill:#69d2ff}.B{font:700 21px Arial;fill:#fff}.M{font:400 15px Arial;fill:#b9cbe0}.K{font:700 13px Arial;fill:#07111f}.P{fill:url(#panel);stroke:#294967;stroke-width:2}.N{fill:#0b1b2d;stroke:#365b7b;stroke-width:2}.G{fill:#0d3b38;stroke:#29c7a0;stroke-width:2}.R{fill:#3d1e2a;stroke:#ff6b88;stroke-width:2}.Y{fill:#3d3215;stroke:#f3c65c;stroke-width:2}.L{stroke:#69d2ff;stroke-width:3;fill:none;marker-end:url(#a)}.tag{fill:#183a55;stroke:#396887;stroke-width:1}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><path d="M0 120H1600" stroke="#21425f"/><text x="60" y="62" class="T">ENTERPRISE LINUX • PRODUCTION TROUBLESHOOTING</text><text x="60" y="94" class="S">A senior-engineer workflow for isolating failures without guesswork or unnecessary production risk</text><g filter="url(#s)"><rect x="55" y="150" width="1490" height="250" rx="24" class="P"/></g><text x="85" y="190" class="H">INCIDENT SIGNALS</text><g><rect x="85" y="220" width="245" height="125" rx="18" class="R"/><text x="110" y="258" class="B">PERFORMANCE</text><text x="110" y="288" class="M">CPU • memory • load</text><text x="110" y="314" class="M">I/O wait • stuck tasks</text><rect x="355" y="220" width="245" height="125" rx="18" class="Y"/><text x="380" y="258" class="B">SERVICES</text><text x="380" y="288" class="M">systemd • failed units</text><text x="380" y="314" class="M">ports • dependencies</text><rect x="625" y="220" width="245" height="125" rx="18" class="N"/><text x="650" y="258" class="B">STORAGE</text><text x="650" y="288" class="M">LVM • filesystem</text><text x="650" y="314" class="M">capacity • mounts</text><rect x="895" y="220" width="245" height="125" rx="18" class="N"/><text x="920" y="258" class="B">NETWORK</text><text x="920" y="288" class="M">DNS • routes • sockets</text><text x="920" y="314" class="M">firewall • reachability</text><rect x="1165" y="220" width="340" height="125" rx="18" class="G"/><text x="1190" y="258" class="B">EVIDENCE FIRST</text><text x="1190" y="288" class="M">Preserve state before changes</text><text x="1190" y="314" class="M">Correlate time + scope + signals</text></g><g filter="url(#s)"><rect x="55" y="435" width="1490" height="225" rx="24" class="P"/></g><text x="85" y="475" class="H">DIAGNOSTIC CHAIN</text><g><rect x="85" y="505" width="190" height="95" rx="16" class="N"/><text x="180" y="542" text-anchor="middle" class="B">01 DETECT</text><text x="180" y="568" text-anchor="middle" class="M">Alert / symptom</text><rect x="320" y="505" width="190" height="95" rx="16" class="N"/><text x="415" y="542" text-anchor="middle" class="B">02 TRIAGE</text><text x="415" y="568" text-anchor="middle" class="M">Health snapshot</text><rect x="555" y="505" width="190" height="95" rx="16" class="N"/><text x="650" y="542" text-anchor="middle" class="B">03 CORRELATE</text><text x="650" y="568" text-anchor="middle" class="M">OS + logs + I/O</text><rect x="790" y="505" width="190" height="95" rx="16" class="G"/><text x="885" y="542" text-anchor="middle" class="B">04 PROVE</text><text x="885" y="568" text-anchor="middle" class="M">Root cause</text><rect x="1025" y="505" width="190" height="95" rx="16" class="N"/><text x="1120" y="542" text-anchor="middle" class="B">05 FIX</text><text x="1120" y="568" text-anchor="middle" class="M">Lowest-risk change</text><rect x="1260" y="505" width="245" height="95" rx="16" class="G"/><text x="1382" y="542" text-anchor="middle" class="B">06 VALIDATE</text><text x="1382" y="568" text-anchor="middle" class="M">Prove recovery</text><path d="M275 552H315M510 552H550M745 552H785M980 552H1020M1215 552H1255" class="L"/></g><g><rect x="55" y="700" width="700" height="220" rx="24" class="P"/><text x="85" y="742" class="H">COMMAND EVIDENCE</text><text x="90" y="780" class="M">top • ps • free • vmstat • iostat</text><text x="90" y="812" class="M">df -hT • lsblk • pvs • vgs • lvs</text><text x="90" y="844" class="M">systemctl • journalctl • dmesg</text><text x="90" y="876" class="M">ip • ss • getent • dig</text><rect x="790" y="700" width="755" height="220" rx="24" class="P"/><text x="820" y="742" class="H">PRODUCTION-SAFE REMEDIATION</text><rect x="820" y="770" width="205" height="48" rx="24" class="tag"/><text x="922" y="800" text-anchor="middle" class="K">PRESERVE EVIDENCE</text><rect x="1040" y="770" width="205" height="48" rx="24" class="tag"/><text x="1142" y="800" text-anchor="middle" class="K">SCOPE THE CHANGE</text><rect x="1260" y="770" width="205" height="48" rx="24" class="tag"/><text x="1362" y="800" text-anchor="middle" class="K">VALIDATE + MONITOR</text><text x="820" y="858" class="M">Rollback-aware • reversible where possible • document root cause</text><text x="60" y="965" class="S">PUBLIC PORTFOLIO EVIDENCE • LAB/REFERENCE DESIGN • NO CONFIDENTIAL PRODUCTION DATA</text></svg>