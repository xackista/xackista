<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#eef3f8"/></linearGradient><linearGradient id="navy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b1f3a"/><stop offset="1" stop-color="#153b68"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#42617f"/></marker><style>.title{font:700 34px Arial;fill:#fff}.sub{font:400 17px Arial;fill:#dbe7f5}.h{font:700 20px Arial;fill:#153b68}.t{font:600 17px Arial;fill:#1d2a38}.small{font:400 14px Arial;fill:#44566b}.tiny{font:400 12px Arial;fill:#52667a}.box{fill:#fff;stroke:#b8c8d8;stroke-width:2;rx:14;filter:url(#shadow)}.soft{fill:#edf5ff;stroke:#9db9d7;stroke-width:2;rx:12}.green{fill:#eef9f2;stroke:#94c7a4;stroke-width:2;rx:12}.purple{fill:#f4f0ff;stroke:#b7a4df;stroke-width:2;rx:12}.line{stroke:#42617f;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1400" height="900" fill="url(#bg)"/><rect width="1400" height="112" fill="url(#navy)"/><text x="55" y="54" class="title">01 • ENTERPRISE LINUX PRODUCTION TROUBLESHOOTING</text><text x="55" y="84" class="sub">Evidence-driven incident response: symptom → evidence → root cause → safe remediation → validation</text>
<rect x="55" y="145" width="280" height="270" class="box"/><text x="75" y="179" class="h">INCIDENT INPUT</text><g class="small"><text x="95" y="209">• User / monitoring alert</text><text x="95" y="239">• High CPU / memory / I/O</text><text x="95" y="269">• Service failure</text><text x="95" y="299">• Filesystem / LVM issue</text><text x="95" y="329">• Network / DNS failure</text></g>
<rect x="410" y="185" width="230" height="90" class="soft"/><text x="525" y="220" text-anchor="middle" class="t">Linux Server</text><text x="525" y="245" text-anchor="middle" class="small">RHEL / Rocky / CentOS</text><rect x="410" y="310" width="230" height="90" class="green"/><text x="525" y="345" text-anchor="middle" class="t">Evidence Layer</text><text x="525" y="370" text-anchor="middle" class="small">top • vmstat • iostat • ss</text>
<rect x="760" y="185" width="230" height="90" class="soft"/><text x="875" y="220" text-anchor="middle" class="t">Logs &amp; Services</text><text x="875" y="245" text-anchor="middle" class="small">systemd • journalctl • dmesg</text><rect x="760" y="310" width="230" height="90" class="green"/><text x="875" y="345" text-anchor="middle" class="t">Storage &amp; Network</text><text x="875" y="370" text-anchor="middle" class="small">LVM • XFS • DNS • sockets</text>
<path d="M335 280 H405" class="line"/><path d="M640 230 H755" class="line"/><path d="M640 355 H755" class="line"/>
<rect x="1050" y="145" width="295" height="270" class="box"/><text x="1070" y="179" class="h">DECISION POINTS</text><g class="small"><text x="1090" y="209">• Scope blast radius</text><text x="1090" y="239">• Correlate timestamps</text><text x="1090" y="269">• Identify bottleneck</text><text x="1090" y="299">• Check recent changes</text><text x="1090" y="329">• Select lowest-risk fix</text></g><path d="M990 230 H1045" class="line"/><path d="M990 355 H1045" class="line"/>
<g><rect x="55" y="500" width="195" height="120" class="box"/><text x="152" y="536" text-anchor="middle" class="t">1. Detect</text><text x="152" y="565" text-anchor="middle" class="small">Alert / report</text><rect x="275" y="500" width="195" height="120" class="box"/><text x="372" y="536" text-anchor="middle" class="t">2. Triage</text><text x="372" y="565" text-anchor="middle" class="small">Quick health checks</text><rect x="495" y="500" width="195" height="120" class="box"/><text x="592" y="536" text-anchor="middle" class="t">3. Investigate</text><text x="592" y="565" text-anchor="middle" class="small">Logs + metrics</text><rect x="715" y="500" width="195" height="120" class="box"/><text x="812" y="536" text-anchor="middle" class="t">4. Root cause</text><text x="812" y="565" text-anchor="middle" class="small">Prove bottleneck</text><rect x="935" y="500" width="195" height="120" class="box"/><text x="1032" y="536" text-anchor="middle" class="t">5. Remediate</text><text x="1032" y="565" text-anchor="middle" class="small">Fix / optimize</text><rect x="1155" y="500" width="190" height="120" class="box"/><text x="1250" y="536" text-anchor="middle" class="t">6. Validate</text><text x="1250" y="565" text-anchor="middle" class="small">Monitor + verify</text><path d="M250 560 H270" class="line"/><path d="M470 560 H490" class="line"/><path d="M690 560 H710" class="line"/><path d="M910 560 H930" class="line"/><path d="M1130 560 H1150" class="line"/></g>
<rect x="55" y="665" width="610" height="145" class="green"/><text x="75" y="699" class="h">COMMON COMMAND EVIDENCE</text><text x="95" y="730" class="small">• top / ps / free / vmstat / iostat</text><text x="95" y="757" class="small">• df -hT / lsblk / pvs / vgs / lvs</text><text x="95" y="784" class="small">• ss -lntup / ip / getent / dig</text><text x="365" y="730" class="small">• systemctl / journalctl / dmesg</text>
<rect x="700" y="665" width="645" height="145" class="purple"/><text x="720" y="699" class="h">PRODUCTION SAFETY</text><text x="740" y="730" class="small">• Preserve evidence before changes</text><text x="740" y="757" class="small">• Prefer reversible, scoped remediation</text><text x="740" y="784" class="small">• Validate before restart / reload</text><text x="1030" y="730" class="small">• Document root cause</text><text x="1030" y="757" class="small">• Prevent recurrence</text><text x="55" y="865" class="tiny">Portfolio evidence • Public lab/reference design • No confidential production data</text></svg>