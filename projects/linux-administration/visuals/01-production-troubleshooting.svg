<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#081421"/>
<rect x="0" y="0" width="1600" height="118" fill="#102a43"/>
<rect x="0" y="116" width="1600" height="2" fill="#45c7e8"/>
<text x="60" y="58" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#ffffff">ENTERPRISE LINUX</text>
<text x="60" y="92" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#45c7e8">PRODUCTION TROUBLESHOOTING</text>
<text x="60" y="146" font-family="Arial,sans-serif" font-size="16" fill="#a9bed2">Evidence-driven incident response: detect → isolate → prove root cause → remediate → validate</text>

<rect x="50" y="180" width="1500" height="230" rx="18" fill="#0d2033" stroke="#294964" stroke-width="2"/>
<text x="80" y="216" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#45c7e8">01 / INCIDENT SIGNALS</text>

<rect x="80" y="245" width="260" height="125" rx="14" fill="#321e29" stroke="#ff6685" stroke-width="2"/>
<text x="105" y="281" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">PERFORMANCE</text>
<text x="105" y="311" font-family="Arial,sans-serif" font-size="15" fill="#c1d1df">CPU • memory • load</text><text x="105" y="337" font-family="Arial,sans-serif" font-size="15" fill="#c1d1df">I/O wait • stuck tasks</text>

<rect x="365" y="245" width="260" height="125" rx="14" fill="#3a3018" stroke="#f0c75e" stroke-width="2"/>
<text x="390" y="281" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">SERVICES</text>
<text x="390" y="311" font-family="Arial,sans-serif" font-size="15" fill="#c1d1df">systemd • failed units</text><text x="390" y="337" font-family="Arial,sans-serif" font-size="15" fill="#c1d1df">ports • dependencies</text>

<rect x="650" y="245" width="260" height="125" rx="14" fill="#10283c" stroke="#4d8bb5" stroke-width="2"/>
<text x="675" y="281" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">STORAGE</text>
<text x="675" y="311" font-family="Arial,sans-serif" font-size="15" fill="#c1d1df">LVM • filesystem • capacity</text><text x="675" y="337" font-family="Arial,sans-serif" font-size="15" fill="#c1d1df">mounts • block devices</text>

<rect x="935" y="245" width="260" height="125" rx="14" fill="#10283c" stroke="#4d8bb5" stroke-width="2"/>
<text x="960" y="281" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">NETWORK</text>
<text x="960" y="311" font-family="Arial,sans-serif" font-size="15" fill="#c1d1df">DNS • routes • sockets</text><text x="960" y="337" font-family="Arial,sans-serif" font-size="15" fill="#c1d1df">firewall • reachability</text>

<rect x="1220" y="245" width="300" height="125" rx="14" fill="#103a35" stroke="#39cba4" stroke-width="2"/>
<text x="1245" y="281" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">EVIDENCE FIRST</text>
<text x="1245" y="311" font-family="Arial,sans-serif" font-size="15" fill="#c1d1df">Preserve state before changes</text><text x="1245" y="337" font-family="Arial,sans-serif" font-size="15" fill="#c1d1df">Correlate time + scope + signals</text>

<rect x="50" y="445" width="1500" height="235" rx="18" fill="#0d2033" stroke="#294964" stroke-width="2"/>
<text x="80" y="481" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#45c7e8">02 / DIAGNOSTIC CHAIN</text>
<g font-family="Arial,sans-serif"><rect x="80" y="515" width="205" height="105" rx="14" fill="#10283c" stroke="#4d8bb5" stroke-width="2"/><text x="182" y="555" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">01 DETECT</text><text x="182" y="582" text-anchor="middle" font-size="14" fill="#b9cbe0">alert / symptom</text>
<text x="300" y="568" font-size="28" fill="#45c7e8">→</text><rect x="330" y="515" width="205" height="105" rx="14" fill="#10283c" stroke="#4d8bb5" stroke-width="2"/><text x="432" y="555" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">02 TRIAGE</text><text x="432" y="582" text-anchor="middle" font-size="14" fill="#b9cbe0">health snapshot</text>
<text x="550" y="568" font-size="28" fill="#45c7e8">→</text><rect x="580" y="515" width="205" height="105" rx="14" fill="#10283c" stroke="#4d8bb5" stroke-width="2"/><text x="682" y="555" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">03 CORRELATE</text><text x="682" y="582" text-anchor="middle" font-size="14" fill="#b9cbe0">OS + logs + I/O</text>
<text x="800" y="568" font-size="28" fill="#45c7e8">→</text><rect x="830" y="515" width="205" height="105" rx="14" fill="#103a35" stroke="#39cba4" stroke-width="2"/><text x="932" y="555" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">04 PROVE</text><text x="932" y="582" text-anchor="middle" font-size="14" fill="#b9cbe0">root cause</text>
<text x="1050" y="568" font-size="28" fill="#45c7e8">→</text><rect x="1080" y="515" width="205" height="105" rx="14" fill="#10283c" stroke="#4d8bb5" stroke-width="2"/><text x="1182" y="555" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">05 FIX</text><text x="1182" y="582" text-anchor="middle" font-size="14" fill="#b9cbe0">lowest-risk change</text>
<text x="1300" y="568" font-size="28" fill="#45c7e8">→</text><rect x="1330" y="515" width="190" height="105" rx="14" fill="#103a35" stroke="#39cba4" stroke-width="2"/><text x="1425" y="555" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">06 VALIDATE</text><text x="1425" y="582" text-anchor="middle" font-size="14" fill="#b9cbe0">prove recovery</text></g>

<rect x="50" y="715" width="720" height="210" rx="18" fill="#0d2033" stroke="#294964" stroke-width="2"/><text x="80" y="752" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#45c7e8">03 / COMMAND EVIDENCE</text><text x="85" y="790" font-family="Arial,sans-serif" font-size="15" fill="#b9cbe0">top • ps • free • vmstat • iostat</text><text x="85" y="820" font-family="Arial,sans-serif" font-size="15" fill="#b9cbe0">df -hT • lsblk • pvs • vgs • lvs</text><text x="85" y="850" font-family="Arial,sans-serif" font-size="15" fill="#b9cbe0">systemctl • journalctl • dmesg</text><text x="85" y="880" font-family="Arial,sans-serif" font-size="15" fill="#b9cbe0">ip • ss • getent • dig</text>
<rect x="800" y="715" width="750" height="210" rx="18" fill="#0d2033" stroke="#294964" stroke-width="2"/><text x="830" y="752" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#45c7e8">04 / PRODUCTION-SAFE REMEDIATION</text><rect x="830" y="785" width="205" height="44" rx="22" fill="#18394f" stroke="#45c7e8"/><text x="932" y="813" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">PRESERVE EVIDENCE</text><rect x="1055" y="785" width="205" height="44" rx="22" fill="#18394f" stroke="#45c7e8"/><text x="1157" y="813" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">SCOPE THE CHANGE</text><rect x="1280" y="785" width="220" height="44" rx="22" fill="#103a35" stroke="#39cba4"/><text x="1390" y="813" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">VALIDATE + MONITOR</text><text x="830" y="870" font-family="Arial,sans-serif" font-size="15" fill="#b9cbe0">Rollback-aware • reversible where possible • document root cause</text>
<text x="60" y="968" font-family="Arial,sans-serif" font-size="13" fill="#718ba3">PUBLIC PORTFOLIO EVIDENCE • LAB / REFERENCE DESIGN • NO CONFIDENTIAL PRODUCTION DATA</text>
</svg>