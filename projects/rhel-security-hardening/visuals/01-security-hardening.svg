<rect x="365" y="245" width="260" height="125" rx="14" fill="#103a35" stroke="#36cba4" stroke-width="2"/><text x="390" y="281" font-size="21" font-weight="700" fill="#fff">SELINUX</text><text x="390" y="311" font-size="15" fill="#c2d2df">enforcing • contexts</text><text x="390" y="337" font-size="15" fill="#c2d2df">AVC analysis</text>
