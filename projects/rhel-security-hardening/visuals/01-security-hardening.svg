<rect x="1220" y="245" width="300" height="125" rx="14" fill="#29203a" stroke="#b18cff" stroke-width="2"/><text x="1245" y="281" font-size="21" font-weight="700" fill="#fff">INTEGRITY</text><text x="1245" y="311" font-size="15" fill="#c2d2df">AIDE • baseline</text><text x="1245" y="337" font-size="15" fill="#c2d2df">configuration drift</text></g>
<rect x="50" y="445" width="1500" height="235" rx="18" fill="#111f32" stroke="#344c65" stroke-width="2"/><text x="80" y="481" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#72e3c1">02 / HARDEN → DETECT → VALIDATE</text>
<g font-family="Arial,sans-serif"><rect x="80" y="515" width="245" height="105" rx="14" fill="#17283b" stroke="#496b87" stroke-width="2"/><text x="202" y="555" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">01 BASELINE</text><text x="202" y="582" text-anchor="middle" font-size="14" fill="#b9cbe0">inventory + assess</text><text x="340" y="568" font-size="28" fill="#72e3c1">→</text><rect x="375" y="515" width="245" height="105" rx="14" fill="#103a35" stroke="#36cba4" stroke-width="2"/><text x="497" y="555" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">02 HARDEN</text><text x="497" y="582" text-anchor="middle" font-size="14" fill="#b9cbe0">apply controls</text><text x="635" y="568" font-size="28" fill="#72e3c1">→</text><rect x="670" y="515" width="245" height="105" rx="14" fill="#29203a" stroke="#b18cff" stroke-width="2"/><text x="792" y="555" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">03 MONITOR</text><text x="792" y="582" text-anchor="middle" font-size="14" fill="#b9cbe0">audit + integrity</text><text x="930" y="568" font-size="28" fill="#72e3c1">→</text><rect x="965" y="515" width="245" height="105" rx="14" fill="#103a35" stroke="#36cba4" stroke-width="2"/><text x="1087" y="555" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">04 VALIDATE</text><text x="1087" y="582" text-anchor="middle" font-size="14" fill="#b9cbe0">verify controls</text><text x="1225" y="568" font-size="28" fill="#72e3c1">→</text><rect x="1260" y="515" width="260" height="105" rx="14" fill="#17283b" stroke="#496b87" stroke-width="2"/><text x="1390" y="555" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">05 REPORT</text><text x="1390" y="582" text-anchor="middle" font-size="14" fill="#b9cbe0">evidence + gaps</text></g>
<rect x="50" y="715" width="720" height="210" rx="18" fill="#111f32" stroke="#344c65" stroke-width="2"/><text x="80" y="752" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#72e3c1">03 / VALIDATION COMMANDS</text><text x="85" y="790" font-family="Arial,sans-serif" font-size="15" fill="#b9cbe0">getenforce • sestatus • ausearch</text><text x="85" y="820" font-family="Arial,sans-serif" font-size="15" fill="#b9cbe0">auditctl -s • firewall-cmd --list-all</text><text x="85" y="850" font-family="Arial,sans-serif" font-size="15" fill="#b9cbe0">sshd -T • aide --check</text><text x="85" y="880" font-family="Arial,sans-serif" font-size="15" fill="#b9cbe0">restorecon • semanage • journalctl</text>
<rect x="800" y="715" width="750" height="210" rx="18" fill="#111f32" stroke="#344c65" stroke-width="2"/><text x="830" y="752" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#72e3c1">04 / CLIENT OUTCOME</text><rect x="830" y="785" width="205" height="44" rx="22" fill="#173a35" stroke="#36cba4"/><text x="932" y="813" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">LOWER ATTACK SURFACE</text><rect x="1055" y="785" width="205" height="44" rx="22" fill="#29203a" stroke="#b18cff"/><text x="1157" y="813" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">AUDITABLE STATE</text><rect x="1280" y="785" width="220" height="44" rx="22" fill="#173a35" stroke="#36cba4"/><text x="1390" y="813" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">REPEATABLE BASELINE</text><text x="830" y="870" font-family="Arial,sans-serif" font-size="15" fill="#b9cbe0">Controls remain observable, testable and maintainable.</text>
<text x="60" y="968" font-family="Arial,sans-serif" font-size="13" fill="#718ba3">PUBLIC PORTFOLIO EVIDENCE • LAB / REFERENCE DESIGN • NO CONFIDENTIAL PRODUCTION DATA</text></svg>