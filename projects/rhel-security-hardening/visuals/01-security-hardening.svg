<text x="60" y="58" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">RHEL SECURITY</text><text x="60" y="92" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#72e3c1">DEFENSE IN DEPTH</text><text x="60" y="146" font-family="Arial,sans-serif" font-size="16" fill="#aabbd0">Hardening, detection and validation integrated into the Linux administration lifecycle</text>
