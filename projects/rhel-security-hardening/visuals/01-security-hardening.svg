<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080f1b"/><stop offset="1" stop-color="#1b1730"/></linearGradient><linearGradient id="p" x2="1" y2="1"><stop stop-color="#14253b"/><stop offset="1" stop-color="#101b2d"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".35"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7ee7c8"/></marker><style>.T{font:700 38px Arial;fill:#fff}.S{font:400 17px Arial;fill:#a8bad0}.H{font:700 18px Arial;fill:#7ee7c8}.B{font:700 21px Arial;fill:#fff}.M{font:400 15px Arial;fill:#b8c9db}.P{fill:url(#p);stroke:#334d68;stroke-width:2}.C{fill:#0f3a36;stroke:#31d1a2;stroke-width:2}.V{fill:#2d203b;stroke:#b58cff;stroke-width:2}.R{fill:#3a1e29;stroke:#ff718d;stroke-width:2}.L{stroke:#7ee7c8;stroke-width:3;fill:none;marker-end:url(#a)}.tag{fill:#18372f;stroke:#3bbd99}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="60" y="62" class="T">RHEL SECURITY • DEFENSE IN DEPTH</text><text x="60" y="94" class="S">Hardening, detection and validation built into the Linux administration lifecycle</text><g filter="url(#s)"><rect x="55" y="145" width="1490" height="250" rx="24" class="P"/></g><text x="85" y="185" class="H">SECURITY CONTROL PLANE</text><g><rect x="85" y="215" width="255" height="135" rx="18" class="C"/><text x="110" y="253" class="B">ACCESS</text><text x="110" y="282" class="M">SSH keys • sudo</text><text x="110" y="308" class="M">PAM • least privilege</text><rect x="365" y="215" width="255" height="135" rx="18" class="C"/><text x="390" y="253" class="B">MANDATORY ACCESS</text><text x="390" y="282" class="M">SELinux enforcing</text><text x="390" y="308" class="M">contexts • AVC analysis</text><rect x="645" y="215" width="255" height="135" rx="18" class="V"/><text x="670" y="253" class="B">NETWORK</text><text x="670" y="282" class="M">firewalld • zones</text><text x="670" y="308" class="M">minimal exposed services</text><rect x="925" y="215" width="255" height="135" rx="18" class="R"/><text x="950" y="253" class="B">AUDIT</text><text x="950" y="282" class="M">auditd • ausearch</text><text x="950" y="308" class="M">security events • logs</text><rect x="1205" y="215" width="300" height="135" rx="18" class="V"/><text x="1230" y="253" class="B">INTEGRITY</text><text x="1230" y="282" class="M">AIDE • baseline</text><text x="1230" y="308" class="M">configuration drift</text></g><g filter="url(#s)"><rect x="55" y="430" width="1490" height="250" rx="24" class="P"/></g><text x="85" y="470" class="H">HARDENING → DETECTION → VALIDATION</text><g><rect x="85" y="505" width="250" height="110" rx="18" class="P"/><text x="210" y="545" text-anchor="middle" class="B">01 BASELINE</text><text x="210" y="575" text-anchor="middle" class="M">Inventory + assess</text><rect x="380" y="505" width="250" height="110" rx="18" class="C"/><text x="505" y="545" text-anchor="middle" class="B">02 HARDEN</text><text x="505" y="575" text-anchor="middle" class="M">Apply controls</text><rect x="675" y="505" width="250" height="110" rx="18" class="V"/><text x="800" y="545" text-anchor="middle" class="B">03 MONITOR</text><text x="800" y="575" text-anchor="middle" class="M">Audit + integrity</text><rect x="970" y="505" width="250" height="110" rx="18" class="C"/><text x="1095" y="545" text-anchor="middle" class="B">04 VALIDATE</text><text x="1095" y="575" text-anchor="middle" class="M">Verify controls</text><rect x="1265" y="505" width="240" height="110" rx="18" class="P"/><text x="1385" y="545" text-anchor="middle" class="B">05 REPORT</text><text x="1385" y="575" text-anchor="middle" class="M">Evidence + gaps</text><path d="M335 560H375M630 560H670M925 560H965M1220 560H1260" class="L"/></g><g><rect x="55" y="715" width="700" height="205" rx="24" class="P"/><text x="85" y="755" class="H">VALIDATION COMMANDS</text><text x="90" y="795" class="M">getenforce • sestatus • ausearch</text><text x="90" y="827" class="M">auditctl -s • firewall-cmd --list-all</text><text x="90" y="859" class="M">sshd -T • aide --check</text><text x="90" y="891" class="M">restorecon / semanage / journalctl</text><rect x="790" y="715" width="755" height="205" rx="24" class="P"/><text x="820" y="755" class="H">CLIENT OUTCOME</text><rect x="820" y="785" width="200" height="42" rx="21" class="tag"/><text x="920" y="812" text-anchor="middle" class="M">LOWER ATTACK SURFACE</text><rect x="1040" y="785" width="200" height="42" rx="21" class="tag"/><text x="1140" y="812" text-anchor="middle" class="M">AUDITABLE STATE</text><rect x="1260" y="785" width="200" height="42" rx="21" class="tag"/><text x="1360" y="812" text-anchor="middle" class="M">REPEATABLE BASELINE</text><text x="820" y="865" class="M">Security controls remain observable, testable and maintainable.</text><text x="60" y="965" class="S">PUBLIC PORTFOLIO EVIDENCE • LAB/REFERENCE DESIGN • NO CONFIDENTIAL PRODUCTION DATA</text></svg>