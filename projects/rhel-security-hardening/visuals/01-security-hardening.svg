<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900"><style>text{font-family:Arial}.title{font-size:34px;font-weight:700;fill:white}.sub{font-size:17px;fill:#dbe7f5}.h{font-size:20px;font-weight:700;fill:#153b68}.t{font-size:17px;font-weight:700;fill:#1d2a38}.s{font-size:14px;fill:#44566b}</style><rect width="1400" height="900" fill="#f4f7fb"/><rect width="1400" height="112" fill="#0b1f3a"/><text x="55" y="54" class="title">02 • RHEL SECURITY HARDENING</text><text x="55" y="84" class="sub">Defense-in-depth Linux baseline with continuous validation</text><g stroke="#b8c8d8" stroke-width="2"><rect x="55" y="155" width="290" height="110" rx="14" fill="#edf5ff"/><rect x="410" y="155" width="350" height="110" rx="14" fill="#eef9f2"/><rect x="825" y="155" width="240" height="110" rx="14" fill="#fff1f1"/><rect x="1130" y="155" width="215" height="110" rx="14" fill="#f4f0ff"/></g><text x="200" y="195" text-anchor="middle" class="t">Users / Administrators</text><text x="200" y="225" text-anchor="middle" class="s">SSH • key auth • sudo</text><text x="585" y="195" text-anchor="middle" class="t">RHEL Server — Hardened</text><text x="585" y="225" text-anchor="middle" class="s">SELinux • PAM • permissions</text><text x="945" y="195" text-anchor="middle" class="t">Firewall</text><text x="945" y="225" text-anchor="middle" class="s">firewalld • least exposure</text><text x="1237" y="195" text-anchor="middle" class="t">Audit / Integrity</text><text x="1237" y="225" text-anchor="middle" class="s">auditd • AIDE • logs</text><g stroke="#42617f" stroke-width="3" marker-end="url(#a)"><path d="M345 210h60"/><path d="M760 210h60"/><path d="M1065 210h60"/></g><g><rect x="55" y="330" width="400" height="230" rx="14" fill="white" stroke="#b8c8d8" stroke-width="2"/><rect x="500" y="330" width="400" height="230" rx="14" fill="white" stroke="#b8c8d8" stroke-width="2"/><rect x="945" y="330" width="400" height="230" rx="14" fill="white" stroke="#b8c8d8" stroke-width="2"/></g><text x="7